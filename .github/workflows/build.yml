
name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify -Pcoverage-aggregate

      - name: Calculate JaCoCo coverage
        id: coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("coverage-report/target/site/jacoco-aggregate/jacoco.xml")
          if not report.is_file():
              raise SystemExit(f"JaCoCo report not found: {report}")

          root = ET.parse(report).getroot()
          counter = root.find("./counter[@type='LINE']")
          if counter is None:
              raise SystemExit("JaCoCo LINE counter not found")

          covered = int(counter.get("covered", 0))
          missed = int(counter.get("missed", 0))
          total = covered + missed

          if total == 0:
              raise SystemExit("JaCoCo report contains no coverage data")

          percent = 100 * covered / total

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"percent={percent:.2f}\n")
              output.write(f"covered={covered}\n")
              output.write(f"missed={missed}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  f"### JaCoCo Coverage\n"
                  f"- Lines: **{percent:.2f}%**\n"
                  f"- Covered: {covered}\n"
                  f"- Missed: {missed}\n"
              )
          PY

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          message: |
            **Line coverage: ${{ steps.coverage.outputs.percent }}%**
            - Covered: ${{ steps.coverage.outputs.covered }}
            - Missed: ${{ steps.coverage.outputs.missed }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-report/target/site/jacoco-aggregate/jacoco.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-aggregate-report
          path: coverage-report/target/site/jacoco-aggregate/
          if-no-files-found: error
